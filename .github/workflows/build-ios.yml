name: Build iOS IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment iOS build number
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const current = Number(config.expo.ios.buildNumber);

          if (!Number.isInteger(current) || current < 1) {
            throw new Error(`Invalid iOS buildNumber: ${config.expo.ios.buildNumber}`);
          }

          const next = current + 1;
          config.expo.ios.buildNumber = String(next);
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          console.log(`Incremented iOS build number: ${current} -> ${next}`);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "chore: increment iOS build number [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean
      
      - name: Show generated iOS project
        run: |
          echo "Generated iOS files:"
          find ios -maxdepth 2 -type d -print

          echo
          echo "Generated Xcode project schemes:"
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"

          if [ ! -d "$PROJECT" ]; then
            echo "Xcode project does not exist: $PROJECT"
            exit 1
          fi

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Configure Xcode workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"

          if [ ! -d "$WORKSPACE" ]; then
            echo "Workspace does not exist: $WORKSPACE"
            exit 1
          fi

          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -showBuildSettings > /dev/null

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Find built app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app not found at:"
            echo "$APP_PATH"

            echo
            echo "Available .app bundles:"
            find build/DerivedData/Build/Products \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "Found app: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Show app metadata
        shell: bash
        run: |
          set -euo pipefail

          PLIST="${{ steps.app.outputs.app_path }}/Info.plist"

          echo "App name:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST"

          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"

          echo "Version:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

          echo "Build:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_SLUG="$(node -p "require('./app.json').expo.slug")"
          IPA_NAME="${APP_SLUG}.ipa"

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "${{ steps.app.outputs.app_path }}" ipa/Payload/

          cd ipa
          zip -qry "../${IPA_NAME}" Payload
          cd ..

          echo "Created IPA:"
          ls -lh "${IPA_NAME}"
      
      - name: Generate SideStore source.json
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.app_path }}"
          PLIST="$APP_PATH/Info.plist"

          NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST")"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")"
          MIN_IOS="$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$PLIST" 2>/dev/null || true)"

          APP_SLUG="$(node -p "require('./app.json').expo.slug")"
          IPA_NAME="${APP_SLUG}.ipa"
          IPA_SIZE="$(stat -f%z "${IPA_NAME}")"
          RELEASE_DATE="$(date -u +"%Y-%m-%d")"

          export NAME
          export BUNDLE_ID
          export VERSION
          export BUILD_VERSION
          export MIN_IOS
          export APP_SLUG
          export IPA_SIZE
          export RELEASE_DATE

          python3 <<'PY'
          import json
          import os

          version_entry = {
              "version": os.environ["VERSION"],
              "buildVersion": os.environ["BUILD_VERSION"],
              "date": os.environ["RELEASE_DATE"],
              "size": int(os.environ["IPA_SIZE"]),
              "downloadURL": f"https://apps.alihan.dk/ipa/{os.environ['APP_SLUG']}.ipa",
              "localizedDescription": "Automated build."
          }

          if os.environ.get("MIN_IOS"):
              version_entry["minOSVersion"] = os.environ["MIN_IOS"]

          source = {
              "$schema": "https://github.com/SideStore/sidestore-source-types/raw/main/schema.json",
              "name": "Everyday Toolbox",
              "identifier": "dk.alihan.apps",
              "sourceURL": "https://apps.alihan.dk/source.json",
              "apps": [
                  {
                      "name": os.environ["NAME"],
                      "bundleIdentifier": os.environ["BUNDLE_ID"],
                      "developerName": "Ali",
                      "subtitle": "Personal iOS apps",
                      "localizedDescription": "Personal app distributed through apps.alihan.dk.",
                      "iconURL": f"https://apps.alihan.dk/icons/{os.environ['APP_SLUG']}.png",
                      "versions": [
                          version_entry
                      ]
                  }
              ]
          }

          with open("source.json", "w") as f:
              json.dump(source, f, indent=2)

          print(json.dumps(source, indent=2))
          PY

      - name: Verify IPA contents
        shell: bash
        run: |
          set -euo pipefail

          APP_SLUG="$(node -p "require('./app.json').expo.slug")"
          IPA_NAME="${APP_SLUG}.ipa"

          unzip -l "${IPA_NAME}" | head -50

          if ! unzip -l "${IPA_NAME}" | grep -q "Payload/.*\.app/Info.plist"; then
            echo "IPA does not contain an iOS .app bundle"
            exit 1
          fi

          echo "IPA structure looks valid."

      - name: Upload IPA and SideStore source
        uses: actions/upload-artifact@v4
        with:
          name: everyday-toolbox-sidestore
          path: |
            *.ipa
            source.json
          if-no-files-found: error
          retention-days: 30

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy IPA and source.json
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          APP_SLUG="$(node -p "require('./app.json').expo.slug")"
          IPA_NAME="${APP_SLUG}.ipa"

          echo "Deploying ${IPA_NAME}"

          scp \
            -i ~/.ssh/deploy_key \
            "${IPA_NAME}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/apps/ipa/${IPA_NAME}.tmp"

          scp \
            -i ~/.ssh/deploy_key \
            source.json \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/apps/source.json.tmp"

          ssh \
            -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "
              set -e

              mv \
                '/var/www/apps/ipa/${IPA_NAME}.tmp' \
                '/var/www/apps/ipa/${IPA_NAME}'

              mv \
                '/var/www/apps/source.json.tmp' \
                '/var/www/apps/source.json'

              chmod 664 \
                '/var/www/apps/ipa/${IPA_NAME}' \
                '/var/www/apps/source.json'
            "

          echo "Deployment complete."


      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          APP_SLUG="$(node -p "require('./app.json').expo.slug")"

          echo "Checking source.json..."
          curl --fail --silent --show-error \
            "https://apps.alihan.dk/source.json" \
            > /dev/null

          echo "Checking IPA..."
          curl --fail --silent --show-error \
            --head \
            "https://apps.alihan.dk/ipa/${APP_SLUG}.ipa"

          echo "Deployment verified."
